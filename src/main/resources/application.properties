spring.application.name=java-learn-ecom

app.name=Java Learn E-Commerce
app.version=0.0.1

spring.datasource.url=jdbc:postgresql://localhost:55432/java_learn_ecom
spring.datasource.username=user_java_learn_ecom
spring.datasource.password=v@nnguyen123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
spring.jpa.properties.hibernate.default_batch_fetch_size=10

spring.data.redis.host=localhost
spring.data.redis.port=56379
spring.data.redis.timeout=2s

app.jwt.secret=v@nnguyEn-Dev-Jwt-Secret-Key-For-HS256-2026
app.jwt.access-token-expiration-minutes=15

app.jwt.refresh-token-expiration-days=7

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=ecom
spring.rabbitmq.password=ecom_local_password

# Receive publisher confirmations associated with each publish
spring.rabbitmq.publisher-confirm-type=correlated

# Enable publisher returns
spring.rabbitmq.publisher-returns=true

# Return messages that cannot be routed to any queue
spring.rabbitmq.template.mandatory=true


spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s

spring.rabbitmq.listener.simple.default-requeue-rejected=false